[package]
name = "burn-sct"
version = "0.1.3"
edition = "2021"
license = "AGPL-3.0"
description = "Spectral Compact Training - permanent truncated SVD with Stiefel QR retraction for Burn"
keywords = ["burn", "sct", "spectral", "svd", "low-rank"]
repository = "https://github.com/sehaxe/burn-sct"
homepage = "https://github.com/sehaxe/burn-sct"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]
serde = ["dep:serde"]
autodiff = ["burn/autodiff"]
binary-tests = []
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda"]

[dependencies]
burn = { version = "0.21", default-features = false }
burn-nn = "0.21"
burn-tensor = "0.21"
burn-cuda = { version = "0.21", optional = true, default-features = false }
burn-cubecl = { version = "0.21", optional = true, default-features = false }
cubecl = { version = "0.10", optional = true, default-features = false, features = ["std", "cuda"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
burn-ndarray = { version = "0.21", features = ["blas-openblas"] }
burn = { version = "0.21", features = ["ndarray"] }
